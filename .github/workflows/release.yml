name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi
      - name: OpenAPI snapshot is not provisional
        run: |
          node -e "if (require('./openapi/openapi.json')['x-provisional']) { console.error('openapi/openapi.json is still the provisional snapshot. Copy in the API document first.'); process.exit(1) }"
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:drift
      - run: pnpm smoke:stdio
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
