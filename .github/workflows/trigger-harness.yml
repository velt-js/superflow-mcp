name: Trigger the test harness

# Called after a real publish (publish-staging.yml, publish.yml). Asks
# snippyly/superflow-mcp-test-harness to install the published version from npm and verify it:
# its verify-package.yml runs the full suite against staging, and for @usesuperflow/mcp also a
# read-only smoke against prod. The same pattern as snippyly/sdk-react's trigger-e2e.yml.
# Needs the PAT_TOKEN secret: a token that may dispatch to the harness repo (fine-grained:
# Contents read and write on snippyly/superflow-mcp-test-harness).

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      version:
        required: true
        type: string
      environment:
        required: true
        type: string
        description: STAGING or PROD
    secrets:
      PAT_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  trigger:
    name: Ask the harness to verify ${{ inputs.package }}@${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch verify-mcp-package
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ -z "$PAT_TOKEN" ]; then echo "::error::Set the PAT_TOKEN secret to dispatch to the harness"; exit 1; fi
          body=$(jq -n --arg repo "$GITHUB_REPOSITORY" --arg branch "$GITHUB_REF_NAME" --arg sha "$GITHUB_SHA" \
            --arg pkg "$PACKAGE" --arg ver "$VERSION" --arg env "$ENVIRONMENT" \
            '{event_type: "verify-mcp-package", client_payload: {source_repo: $repo, source_branch: $branch, source_sha: $sha, package: $pkg, version: $ver, environment: $env}}')
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PAT_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$body" \
            https://api.github.com/repos/snippyly/superflow-mcp-test-harness/dispatches
          echo "Asked the harness to verify $PACKAGE@$VERSION: https://github.com/snippyly/superflow-mcp-test-harness/actions/workflows/verify-package.yml" >> "$GITHUB_STEP_SUMMARY"
